name: Precios por sucursal (SEPA)

# SEPA publica cada día alrededor de las 16:20 (hora argentina) los precios de esa mañana.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  sepa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias del scraper
        run: npm --prefix scraper ci
      - name: Cargar precios SEPA
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx sepa-import.ts --write
      - name: Buscar fotos de los productos nuevos
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx fill-images.ts --write
      - name: Revisar alertas de precio
        if: always()
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npx tsx check-alerts.ts --write
