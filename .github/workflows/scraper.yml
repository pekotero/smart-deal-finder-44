name: Actualización Diaria de Precios

on:
  schedule:
    # Corre todos los días a las 07:00 UTC (4:00 AM hora Argentina)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del scraper
        run: |
          cd scraper
          npm install

      - name: Ejecutar Scraper VTEX
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          npm run scrape